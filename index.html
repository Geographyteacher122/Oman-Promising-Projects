<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a4a47">
<title>مشاريع اقتصادية عُمانية واعدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ocean:#073B4C;--gulf:#1499B8;--sand:#E8D3A8;--gold:#D9A441;--green:#26734D;--pearl:#F7F3E8;--ink:#1d2b2f;--red:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Cairo','Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:var(--ocean);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit}
#app{height:100dvh;display:flex;flex-direction:column}
.hud{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;color:#fff;background:rgba(7,59,76,.92);border-bottom:3px solid var(--gold);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand h1{margin:0;font-size:clamp(17px,2.4vw,26px);font-weight:900;line-height:1.15;color:#ffe9a8}
.brand small{display:block;font-size:clamp(12px,1.5vw,14px);font-weight:600;opacity:.85}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:3px 12px;text-align:center;min-width:64px}
.stat b{display:block;font-size:21px;font-weight:900}.stat span{font-size:12px;opacity:.85}
.hbtn{appearance:none;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:12px;width:42px;height:42px;font-size:19px;cursor:pointer}
.main{flex:1;min-height:0;display:grid;grid-template-columns:clamp(330px,34vw,440px) minmax(0,1fr);gap:12px;padding:10px 12px 4px}
.panel{min-height:0;display:flex;flex-direction:column;gap:8px}
.prog{flex:none;display:flex;gap:4px;padding:6px 8px;background:rgba(247,243,232,.12);border-radius:14px}
.prog i{flex:1;height:8px;border-radius:6px;background:rgba(255,255,255,.25)}
.prog i.done{background:var(--gold)}.prog i.cur{background:#fff;animation:pul 1.2s infinite}
@keyframes pul{50%{opacity:.4}}
.qcard{flex:1;min-height:0;overflow:auto;background:linear-gradient(180deg,#fffdf6,var(--pearl));border:3px solid var(--gold);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 28px rgba(0,0,0,.3);animation:cin .4s both}
@keyframes cin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pill{display:inline-flex;padding:3px 14px;border-radius:999px;background:var(--ocean);color:#ffe9a8;font-weight:800;font-size:15px}
.badge{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q{font-size:clamp(20px,3vh,26px);font-weight:800;line-height:1.7;color:var(--ocean);background:#fff;border:1px solid #eadfb9;border-radius:16px;padding:10px 14px}
.q b{color:var(--green)}
.hintbox{font-size:17px;font-weight:700;color:#5a4306;background:#fff3cf;border:1px dashed var(--gold);border-radius:12px;padding:6px 12px}
.opts{display:grid;gap:8px}
.opt{appearance:none;border:2px solid #d4b062;background:#fffaf0;border-radius:16px;padding:10px 14px;font-size:clamp(17px,2.6vh,21px);font-weight:800;color:var(--ocean);cursor:pointer;text-align:start;box-shadow:0 3px 0 #b98f3a;transition:transform .12s}
.opt:active{transform:translateY(2px)}
.opt.right{background:#d8f3e3;border-color:var(--green)}.opt.wrong{background:#fde1dc;border-color:var(--red);animation:shk .4s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{appearance:none;border:0;border-radius:14px;padding:11px 18px;font-weight:900;font-size:18px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--gulf),#0b6e87);box-shadow:0 4px 0 #084a5f}
.btn.gold{background:linear-gradient(135deg,#f4c64d,#d49a1c);color:#3b2a05;box-shadow:0 4px 0 #9a6c10}
.btn.ghost{background:#fff;color:var(--ocean);box-shadow:0 4px 0 #cdbf95;border:1px solid #e0d3aa}
.btn.small{padding:5px 12px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.5}
.note{font-size:14px;font-weight:700;color:#8a7647;text-align:center}
.stars{display:flex;justify-content:center;gap:6px}.stars svg{width:44px;height:44px}
.stars svg path{fill:#e5dcc0;stroke:#cbbd93;stroke-width:2}.stars svg.on path{fill:var(--gold);stroke:#b57d06}
.info{background:#fff;border:1px solid #eadfb9;border-radius:16px;padding:10px 14px;font-size:clamp(18px,2.6vh,22px);font-weight:700;line-height:1.9}
.info b{color:var(--ocean)}
.stage{position:relative;min-width:0;min-height:0;border-radius:20px;overflow:hidden;border:4px solid var(--gold);box-shadow:0 14px 40px rgba(0,0,0,.4);background:#1d7fa0;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.zb{position:absolute;bottom:12px;inset-inline-start:12px;z-index:3;display:flex;flex-direction:column;gap:8px}
.zb button{width:44px;height:44px;border-radius:12px;border:2px solid #fff;background:rgba(7,59,76,.88);color:#fff;font-size:22px;font-weight:900;cursor:pointer}
#toast{position:absolute;top:10px;left:50%;transform:translate(-50%,-8px);z-index:4;max-width:90%;padding:8px 18px;border-radius:999px;background:rgba(7,59,76,.94);color:#ffe9a8;border:2px solid var(--gold);font-weight:800;font-size:clamp(15px,2vh,18px);opacity:0;transition:.3s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#7d1f15;color:#fff;border-color:#fff}#toast.ok{background:#14532d;color:#fff;border-color:#fff}
footer{flex:none;text-align:center;padding:2px 10px 6px;font-size:14px;font-weight:700;color:#ffe9a8}
.rng{display:inline-flex;direction:rtl;unicode-bidi:isolate;white-space:nowrap}
.gov{fill:#f0e1b8;stroke:#8a6a2c;stroke-width:1.6;stroke-linejoin:round;cursor:pointer;transition:fill .3s;vector-effect:non-scaling-stroke}
.gov.alt{fill:#ead7a6}
.gov:hover{fill:#f8ecc4}
.gov.solved{fill:#9ad2a8}.gov.bad{fill:#f2a399!important}.gov.good{fill:#58b878!important}.gov.pulse{animation:gp 1s infinite}
@keyframes gp{50%{fill:#ffe08a}}
.lb{pointer-events:none}
.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
.pinG{animation:drop .5s cubic-bezier(.3,1.5,.5,1) both}
/* overlays */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:12px;overflow:auto}
.overlay.hidden{display:none}
#intro{background:#050f2a}
#intro .scene{position:absolute;inset:0}#intro .scene svg{width:100%;height:100%;display:block}
.ic{position:relative;z-index:2;width:min(640px,100%);text-align:center;color:#fff;padding:clamp(14px,3vh,28px) clamp(14px,3vw,30px);background:radial-gradient(ellipse 70% 62% at 50% 50%,rgba(5,15,42,.82) 0%,rgba(5,15,42,.55) 60%,rgba(5,15,42,0) 100%);text-shadow:0 2px 8px #000,0 0 3px #000}
.ic h2{margin:6px 0;font-size:clamp(28px,6vh,48px);font-weight:900;color:#ffe9a8;line-height:1.3}
.ic .lesson{display:inline-block;padding:3px 16px;border-radius:999px;border:1.5px solid var(--gold);background:rgba(217,164,65,.18);color:#ffe9a8;font-weight:800;font-size:clamp(14px,2.2vh,18px);margin-bottom:8px}
.ic p{margin:6px 0;font-size:clamp(15px,2.4vh,19px);font-weight:700;line-height:1.7}
.ic .btn{margin:10px 0;font-size:clamp(18px,3vh,22px);padding:12px 36px;text-shadow:none}
.ic .credit{margin-top:8px;padding-top:8px;border-top:2px dashed rgba(217,164,65,.6);font-weight:800;font-size:clamp(13px,2vh,16px);color:#ffe9a8}
.scene .tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}
.scene .dhow{animation:sail 40s -14s linear infinite}@keyframes sail{from{transform:translateX(-140px)}to{transform:translateX(1740px)}}
.scene .dhow g{animation:rock 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}@keyframes rock{50%{transform:translate(0,-4px) rotate(3deg)}}
.scene .glint{animation:gl 3s linear infinite}@keyframes gl{to{stroke-dashoffset:-90}}
.scene .moon{animation:bob 6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(10px)}}
.scene .pn{animation:pn 3s ease-in-out infinite}@keyframes pn{50%{transform:translateY(-12px)}}
#end{background:rgba(5,15,42,.8);backdrop-filter:blur(6px)}
.card{width:min(560px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:linear-gradient(180deg,#fffdf6,var(--pearl));border:4px double var(--gold);border-radius:26px;padding:18px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.card h2{margin:0 0 4px;font-size:28px;font-weight:900;color:var(--ocean)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.res div{background:#fff;border:1px solid #eadfb9;border-radius:14px;padding:6px}.res b{display:block;font-size:23px;font-weight:900;color:var(--ocean)}.res span{font-size:13px;color:#6b5a38}
.nameIn{width:100%;padding:11px 14px;border-radius:14px;border:2px solid #d9c993;font:inherit;font-weight:800;font-size:19px;text-align:center;background:#fff;color:var(--ocean);-webkit-user-select:text;user-select:text;margin:6px 0 10px}
.endbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.endbtns .btn{flex:1;min-width:130px}
.credit2{margin-top:10px;font-weight:800;font-size:15px;color:var(--ocean);border-top:2px dashed #c9a24a;padding-top:8px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (max-width:860px),(max-aspect-ratio:1/1){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,42dvh) minmax(0,1fr);padding:8px 8px 4px;gap:8px}
  .stage{order:-1}.q{font-size:19px}.opt{font-size:17px;padding:8px 12px}.brand small{display:none}.brand h1{font-size:17px}.stat{padding:2px 8px;min-width:54px}.stat b{font-size:18px}
  footer{font-size:12.5px}
}
@media (max-height:520px) and (min-width:700px){.q{font-size:17px;padding:6px 10px}.opt{font-size:15.5px;padding:5px 10px}.qcard{padding:8px;gap:6px}.brand small{display:none}footer{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v2: أشكال مسطّحة مستوحاة من ColorHunt + رسومات وحركة جغرافية ===== */
body{font-family:'Readex Pro','Cairo','Tajawal','Segoe UI',Tahoma,Arial,sans-serif}
.hud{border-bottom:0;box-shadow:0 6px 0 rgba(217,164,65,.9)}
.qcard{border:0;border-radius:30px;box-shadow:0 14px 34px rgba(0,0,0,.28);background:#fff}
.q{border:0;background:var(--pearl);border-radius:22px}
.pill{border-radius:999px;font-weight:700}
.opt{border:0;border-radius:999px;background:var(--pearl);box-shadow:inset 0 0 0 2px #cdbd93;padding:12px 20px;transition:transform .15s,box-shadow .15s,background .2s}
.opt:hover{transform:translateY(-2px);background:#fff;box-shadow:inset 0 0 0 2px var(--gold),0 6px 14px rgba(0,0,0,.12)}
.opt.right{background:#d5eedd;box-shadow:inset 0 0 0 3px var(--green)}.opt.wrong{background:#fbdcd6;box-shadow:inset 0 0 0 3px var(--red)}
.btn{border-radius:999px;box-shadow:0 5px 0 #084a5f,0 10px 18px rgba(0,0,0,.18)}
.btn.gold{box-shadow:0 5px 0 #9a6c10,0 10px 18px rgba(0,0,0,.18)}
.info{border:0;background:var(--pearl);border-radius:22px}
.hintbox{border:0;border-radius:18px}
.stage{border:0;border-radius:30px;box-shadow:0 0 0 5px var(--pearl),0 16px 40px rgba(0,0,0,.4)}
.prog{background:transparent;padding:2px 0;gap:6px}
.prog i{height:14px;border-radius:7px;background:rgba(255,255,255,.2)}
.prog i.done:nth-child(5n+1){background:#E8D3A8}.prog i.done:nth-child(5n+2){background:#D9A441}.prog i.done:nth-child(5n+3){background:#26734D}.prog i.done:nth-child(5n+4){background:#1499B8}.prog i.done:nth-child(5n+5){background:#F7F3E8}
.compass{position:absolute;top:12px;inset-inline-start:12px;z-index:3;width:70px;height:70px;pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.compass .nd{transform-origin:50% 50%;animation:nd 7s ease-in-out infinite}
@keyframes nd{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.compass .rg{transform-origin:50% 50%;animation:rg 60s linear infinite}@keyframes rg{to{transform:rotate(360deg)}}
.sea-dhow{animation:sd 50s linear infinite}@keyframes sd{from{transform:translateX(-300px)}to{transform:translateX(1400px)}}
.sea-dhow .rk{animation:rk 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}@keyframes rk{50%{transform:translateY(-4px) rotate(3deg)}}
.rt{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;opacity:.9;vector-effect:non-scaling-stroke;animation:rd .9s ease-out both,fl 1.2s linear infinite}
@keyframes rd{from{opacity:0}to{opacity:.9}}@keyframes fl{to{stroke-dashoffset:-22}}
.grat{stroke:#fff;stroke-opacity:.14;stroke-width:1;stroke-dasharray:4 8;fill:none;vector-effect:non-scaling-stroke}
.swell{animation:sw 6s ease-in-out infinite alternate}@keyframes sw{to{transform:translateX(-30px)}}
.card,.ic{border-radius:30px}
@media (max-width:860px),(max-aspect-ratio:1/1){.compass{width:48px;height:48px;top:8px}.opt{padding:9px 16px}}

/* v3 style: original illustrations, Sindbad palette */
body{font-family:'Readex Pro','Cairo','Tajawal','Segoe UI',Tahoma,sans-serif;background:radial-gradient(120% 90% at 50% 0%,#0b5468,#073B4C 60%,#052a38)}
.hud{border-bottom:0;box-shadow:0 3px 0 var(--gold)}
.qcard{border:0;border-radius:30px;box-shadow:0 0 0 5px rgba(217,164,65,.55),0 14px 32px rgba(0,0,0,.3)}

.pill{box-shadow:0 2px 0 #b98f3a}

.btn{border-radius:999px}
.prog{border-radius:999px}
.prog i{height:10px}
.prog i:nth-child(3n+1).done{background:var(--gold)}.prog i:nth-child(3n+2).done{background:var(--gulf)}.prog i:nth-child(3n).done{background:var(--green)}
.stage{border:0;border-radius:30px;box-shadow:0 0 0 5px #f7f3e8,0 0 0 8px var(--gold),0 16px 40px rgba(0,0,0,.45)}

.wv{animation:wv 7s ease-in-out infinite alternate}.wv.b{animation-duration:9s;animation-delay:-3s}

/* ===== تصميم جديد: فجر المشاريع الواعدة ===== */
:root{--ocean:#0a4a47;--gold:#f2a33a;--green:#26734d;--pearl:#fff6e0}
body{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:#d3f0e8 linear-gradient(180deg,#e9faf5,#fff1cf)}

.q,.info{background:#fff;border-radius:14px;box-shadow:inset 0 0 0 2px #cfe5df;color:#0a4a47}.q b{color:#e8761c}.info b{color:#0a4a47}

.note{color:#3f6b66}
.hintbox{background:#fff3d2;color:#6a4306;border:1px dashed #e08a1e}
.opt{background:#fff;border:2px solid #0a4a47;box-shadow:0 3px 0 #0a4a47;border-radius:12px;color:#0a4a47}.opt:hover{background:#fff3d2;transform:none;box-shadow:0 3px 0 #0a4a47}

.btn{background:#e8761c;color:#fff;border-radius:12px;box-shadow:0 4px 0 #a9500f,0 8px 14px rgba(10,74,71,.25)}

.zb button{background:#fff;color:#0a4a47;border:2px solid #0a4a47;box-shadow:0 3px 0 #0a4a47}

/* intro */
#intro{background:#bff0e2;padding:0}
#intro .scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.ic2{position:relative;z-index:2;width:100%;height:100%;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:clamp(20px,9vh,90px) 18px clamp(12px,3vh,26px)}
.ic2 .lesson{display:inline-block;padding:3px 20px;border-radius:10px;border:2px solid #fff;background:#0a4a47;color:#ffd166;font-weight:900;font-size:clamp(15px,2.6vh,21px);animation:floaty 4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-4px)}}
.ic2 h2{margin:12px 0 0;color:#0a4a47;font-weight:900;line-height:1.2;font-size:clamp(30px,8.2vh,76px);text-shadow:0 2px 0 #fff,0 0 22px rgba(255,255,255,.9)}
.ic2 h2 .l2{display:block;font-size:.8em;color:#e8761c}
.ink{display:block;clip-path:inset(0 0 0 100%);animation:inkr 1.6s .3s cubic-bezier(.3,.7,.2,1) forwards}.ink.d2{animation-delay:1.1s}@keyframes inkr{to{clip-path:inset(0 0 0 0)}}
.ic2 .btn{margin:14px 0 6px;font-size:clamp(19px,3.2vh,26px);padding:13px 46px;animation:bp 2.4s ease-in-out infinite}@keyframes bp{50%{transform:scale(1.04)}}
.ic2 .credit{font-weight:900;font-size:clamp(16px,2.8vh,24px);color:#fff;text-shadow:0 2px 8px rgba(4,43,41,.9),0 0 3px #042b29;line-height:1.55}.ic2 .credit .c1,.ic2 .credit .c2{display:block}.ic2 .credit .sep{display:none}
@media (max-width:860px),(max-aspect-ratio:1/1){.main{grid-template-columns:1fr;grid-template-rows:minmax(0,42dvh) minmax(0,1fr);padding:18px 14px 14px}.stage{order:-1;box-shadow:0 0 0 3px #fff,0 0 0 6px #0a4a47,0 0 0 8px #fff,0 0 0 10px #e8761c,0 10px 20px rgba(10,74,71,.4)}.ic2 h2{font-size:clamp(28px,9vw,44px)}.ic2 .credit{font-size:clamp(15px,4.2vw,20px)}.guide{display:none}}
/* مشهد */
.scene .sun{transform-box:fill-box;transform-origin:center;animation:scSun 5s ease-in-out infinite}@keyframes scSun{50%{transform:scale(1.07);opacity:.85}}
.scene .cl1{animation:scDr 160s linear infinite}.scene .cl2{animation:scDr 110s linear -50s infinite}@keyframes scDr{from{transform:translateX(-300px)}to{transform:translateX(1900px)}}
.scene .bl{transform-box:fill-box;transform-origin:center;animation:spn 9s linear infinite}.scene .bl.s{animation-duration:13s}@keyframes spn{to{transform:rotate(360deg)}}
.scene .flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl2 .8s ease-in-out infinite alternate}@keyframes fl2{from{transform:scale(1,.8)}to{transform:scale(1.15,1.2)}}
.scene .smk{transform-box:fill-box;transform-origin:center;animation:sm 4s ease-out infinite}.scene .smk.b{animation-delay:-1.3s}.scene .smk.c{animation-delay:-2.6s}@keyframes sm{from{transform:translate(0,0) scale(.5);opacity:.7}to{transform:translate(30px,-90px) scale(1.8);opacity:0}}
.scene .sway{transform-box:fill-box;transform-origin:50% 100%;animation:swy 3.6s ease-in-out infinite alternate}.scene .sway.b{animation-delay:-1.2s}@keyframes swy{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.scene .pinf{animation:scPin 3s ease-in-out infinite}.scene .pinf.p2{animation-delay:-1s}.scene .pinf.p3{animation-delay:-2s}.scene .pinf.p4{animation-delay:-.5s}@keyframes scPin{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.scene .bird{animation:scFly 38s linear infinite}@keyframes scFly{from{transform:translateX(1800px)}to{transform:translateX(-300px)}}
.scene .wv{animation:scWv 12s linear infinite}@keyframes scWv{from{transform:translateX(0)}to{transform:translateX(-800px)}}
.scene .bobd{transform-box:fill-box;transform-origin:50% 100%;animation:scBob 3.6s ease-in-out infinite}@keyframes scBob{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-5px)}}
/* ===== المرحلة الثانية: عالم المغامرة ===== */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}.bgfx svg{width:100%;height:100%;display:block}
#app{position:relative;z-index:1}
.bgfx .c1{animation:bgc 140s linear infinite}.bgfx .c2{animation:bgc 90s linear -40s infinite}@keyframes bgc{from{transform:translateX(-300px)}to{transform:translateX(1800px)}}
.bgfx .bw{animation:scWv 16s linear infinite}.bgfx .bw.w2{animation-duration:11s;animation-direction:reverse}
.sweep{position:absolute;top:0;bottom:0;left:0;width:40%;z-index:2;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);animation:swp 9s ease-in-out infinite}
@keyframes swp{from{transform:translateX(-120%)}to{transform:translateX(330%)}}
.stage::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 28% 12%,rgba(255,255,255,.22),transparent 55%),radial-gradient(ellipse at 50% 125%,rgba(4,43,41,.28),transparent 60%)}
.sw{animation:swo 6s ease-in-out infinite}@keyframes swo{0%,100%{opacity:.15}50%{opacity:.6}}
.shake{animation:shk .45s}@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.wrip{transform-box:fill-box;transform-origin:center;animation:wr .85s ease-out both}@keyframes wr{from{transform:scale(.4);opacity:1}to{transform:scale(2.2);opacity:0}}
.spkg .spk{transform-box:view-box;transform-origin:0 0;transform:rotate(var(--a)) translateY(0);animation:spk 1.4s ease-out both}
@keyframes spk{0%{transform:rotate(var(--a)) scale(.2);opacity:1}60%{opacity:1}100%{transform:rotate(var(--a)) scale(2.2) translateY(-14px);opacity:0}}
.guide img{animation:gIdle 6s ease-in-out infinite}@keyframes gIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.guide img.cheer{animation:gCh 1.8s ease-in-out}.guide img.think{animation:gTh 1.8s ease-in-out}
@keyframes gCh{0%,100%{transform:none}40%{transform:translateY(-9px) rotate(-1deg)}70%{transform:translateY(-3px)}}
@keyframes gTh{0%,100%{transform:none}35%{transform:rotate(-1.6deg) translateX(-3px)}70%{transform:rotate(1.2deg) translateX(2px)}}
.bub{position:absolute;top:30%;left:2%;transform:scale(.6);background:#fff;color:#0a4a47;font-weight:900;font-size:clamp(14px,2.2vh,18px);padding:8px 16px;border-radius:16px;border:3px solid #0a4a47;box-shadow:0 4px 0 #0a4a47;opacity:0;pointer-events:none;white-space:nowrap;z-index:4;transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.bub::after{content:'';position:absolute;bottom:-11px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#0a4a47;border-bottom:0}
.bub.on{opacity:1;transform:scale(1)}
#badge{position:fixed;top:70px;left:50%;z-index:60;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0a4a47,#16817a);color:#fff;padding:10px 20px 10px 22px;border-radius:18px;border:3px solid #ffd166;box-shadow:0 10px 30px rgba(4,43,41,.5);transform:translate(-50%,-160%);opacity:0;pointer-events:none;direction:rtl}
#badge div{display:flex;flex-direction:column;line-height:1.25}#badge small{color:#ffd166;font-weight:800;font-size:12px}#badge b{font-size:18px;font-weight:900}#badge span{font-size:13px;font-weight:600;opacity:.9}
#badge.on{animation:bdg 3.4s cubic-bezier(.3,1.3,.5,1) both}@keyframes bdg{0%{transform:translate(-50%,-160%);opacity:0}12%{transform:translate(-50%,0);opacity:1}86%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-160%);opacity:0}}
#banner{position:fixed;inset:0;z-index:55;pointer-events:none;display:grid;place-items:center;opacity:0}
#banner::before{content:'';position:absolute;left:0;right:0;top:38%;height:24%;background:linear-gradient(90deg,transparent,rgba(10,74,71,.86) 18%,rgba(10,74,71,.86) 82%,transparent);transform:scaleX(0)}
#banner .bn{position:relative;display:flex;align-items:center;gap:14px;color:#fff;direction:rtl}#banner small{display:block;color:#ffd166;font-weight:800;font-size:clamp(14px,2.4vh,20px)}#banner b{font-size:clamp(24px,5.5vh,44px);font-weight:900}
#banner.on{animation:bnr 2.2s ease both}#banner.on::before{animation:bnb 2.2s ease both}#banner.on .bn{animation:bnt 2.2s ease both}
@keyframes bnr{0%,100%{opacity:0}8%,86%{opacity:1}}@keyframes bnb{0%{transform:scaleX(0)}22%,80%{transform:scaleX(1)}100%{transform:scaleX(1)}}@keyframes bnt{0%,12%{transform:translateY(14px);opacity:0}30%,80%{transform:none;opacity:1}100%{transform:translateY(-10px);opacity:0}}
#intro.leaving{animation:lv .65s ease-in forwards}@keyframes lv{to{transform:scale(1.18);opacity:0;filter:blur(3px)}}
#end::before{content:'';position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(from 0deg,rgba(255,224,138,.07) 0 7deg,transparent 7deg 20deg);animation:spinr 60s linear infinite;pointer-events:none}
#endCard{position:relative}
.bdgrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 8px}.bd{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;color:#0a4a47;animation:stamp .6s cubic-bezier(.3,1.6,.5,1) both}.bd:nth-child(2){animation-delay:.15s}.bd:nth-child(3){animation-delay:.3s}.bd:nth-child(4){animation-delay:.45s}
@media (max-width:860px){#badge{top:60px}}
@media (prefers-reduced-motion:reduce){#banner.on{opacity:1}}
.scene .shipd{animation:scDrift 16s ease-in-out infinite}@keyframes scDrift{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}
.scene .puff{animation:scPuff 3s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes scPuff{from{transform:translate(0,0) scale(.6);opacity:.7}to{transform:translate(-26px,-40px) scale(1.8);opacity:0}}

.sea-dhow,#deco .dhow{display:none}
@media (max-width:860px),(max-aspect-ratio:1/1){.qcard{flex:1 1 auto;min-height:0;overflow:auto}.panel{padding-bottom:6px}footer{font-size:12px;line-height:1.3;padding:0 6px 6px}}

.scene .plane{animation:pln 46s linear infinite}@keyframes pln{from{transform:translateX(1800px)}to{transform:translateX(-300px)}}
.scene .trl{animation:trl 9s ease-in-out infinite alternate}@keyframes trl{from{transform:translateX(-150px)}to{transform:translateX(150px)}}
.scene .swg{transform-box:fill-box;transform-origin:50% 0;animation:swg 2.4s ease-in-out infinite alternate}@keyframes swg{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.scene .stk{animation:stk 1.6s linear infinite}@keyframes stk{to{stroke-dashoffset:-160}}
.scene .ln{animation:ln 1s linear infinite}@keyframes ln{to{stroke-dashoffset:-66}}
.scene .tr1{animation:tr 26s linear infinite}.scene .tr2{animation:tr 40s linear -14s infinite}@keyframes tr{from{transform:translateX(-420px)}to{transform:translateX(2000px)}}
#intro{background:linear-gradient(180deg,#bcd9ee,#f3efe8 62%,#ffd7a0)}#intro .scene{top:auto;bottom:0;height:52%}
#intro .scene{height:56%;overflow:visible}

/* ===== شاشة البداية: ميناء عُماني ===== */
#intro{background:radial-gradient(ellipse 42% 30% at 50% 26%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%),linear-gradient(180deg,#5db9ee 0%,#9fd8f6 48%,#dff3fb 100%)}
#intro .sky{position:absolute;left:0;top:0;width:100%;height:46%;display:block;pointer-events:none}
.sky .cld{animation:cld 12s ease-in-out infinite alternate}.sky .cld.b{animation-duration:15s;animation-delay:-5s}@keyframes cld{to{transform:translateX(28px)}}
.sky .gul{animation:gul 6s ease-in-out infinite alternate}.sky .gul.g2{animation-delay:-2s}@keyframes gul{from{transform:translate(0,0)}to{transform:translate(16px,-10px)}}
.scene .wv2{animation:wv2 5s ease-in-out infinite alternate}@keyframes wv2{to{transform:translateX(16px)}}
.scene .flag{transform-box:fill-box;transform-origin:0 50%;animation:flg 2.4s ease-in-out infinite alternate}@keyframes flg{from{transform:skewY(-4deg) scaleX(1)}to{transform:skewY(4deg) scaleX(.93)}}
.scene .fk{animation:fk 9s ease-in-out infinite alternate}@keyframes fk{to{transform:translateX(-70px)}}
.scene .pinf{opacity:.9}
.ic2 h2 .l2{color:#f08a1c}

 background:linear-gradient(180deg,#ffd061 0%,#ffa826 38%,#f27a10 100%);
 box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(163,72,0,.45),inset 0 0 16px rgba(255,236,170,.35),0 8px 0 #b4560b,0 18px 26px rgba(110,48,0,.42);
 text-shadow:0 2px 0 rgba(170,80,0,.6),0 0 10px rgba(255,200,90,.6);transition:transform .22s cubic-bezier(.3,1.4,.5,1),box-shadow .22s,filter .22s;animation:none}
.ic2 .btn::before{content:'';position:absolute;left:5%;right:5%;top:3px;height:46%;border-radius:999px 999px 60% 60%/999px 999px 100% 100%;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.08));pointer-events:none}
.ic2 .btn::after{content:'';position:absolute;top:-20%;bottom:-20%;width:34%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-22deg);animation:bshine 4.2s ease-in-out infinite;pointer-events:none}
@keyframes bshine{0%,55%{left:-50%}100%{left:130%}}
.ic2 .btn .bt,.ic2 .btn .st{position:relative;z-index:1}
.ic2 .btn .st{display:inline-block;width:28px;height:28px}.ic2 .btn .st svg{filter:drop-shadow(0 1px 0 rgba(170,80,0,.7));animation:stw 3.2s ease-in-out infinite;transform-origin:center}@keyframes stw{50%{transform:scale(1.12) rotate(10deg)}}
.ic2 .btn .sp{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(255,240,180,.9);opacity:0;animation:spk2 2.8s ease-in-out infinite}
.ic2 .btn .sp.s1{top:-4px;right:-3px}.ic2 .btn .sp.s2{bottom:0;left:-6px;animation-delay:-.9s}.ic2 .btn .sp.s3{top:2px;left:-4px;animation-delay:-1.8s;width:4px;height:4px}
@keyframes spk2{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.ic2 .btn:hover{transform:translateY(-4px);filter:brightness(1.06) saturate(1.05);box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -5px 0 rgba(163,72,0,.45),inset 0 0 18px rgba(255,236,170,.5),0 12px 0 #b4560b,0 24px 32px rgba(110,48,0,.42),0 0 28px 6px rgba(255,170,40,.45)}
.ic2 .btn:active{transform:translateY(6px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(163,72,0,.45),0 2px 0 #b4560b,0 5px 8px rgba(110,48,0,.4);transition-duration:.08s}
.ic2 .btn:focus-visible{outline:3px solid #fff;outline-offset:4px}
@media (prefers-reduced-motion:reduce){.ic2 .btn::after,.ic2 .btn .sp{display:none}}

  x.font=`700 28px ${F}`;let rows=[[]],ws=0;PR.forEach(p=>{const w=x.measureText(p.n).width+44;if(ws+w>1200){rows.push([]);ws=0}rows[rows.length-1].push([p.n,w]);ws+=w+12});
  rows.forEach((r,i)=>{const tot=r.reduce((a,b)=>a+b[1]+12,-12);let px=W/2+tot/2;r.forEach(([n,w])=>{px-=w;x.fillStyle='#073B4C';x.beginPath();x.roundRect?x.roundRect(px,920+i*54,w,42,21):x.rect(px,920+i*54,w,42);x.fill();x.fillStyle='#ffe9a8';x.fillText(n,px+w/2,942+i*54);px-=12})});
